<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>GPX Telemetry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root { --ink: #f5f5f5; --muted: #999; --line: #292929; --blue: #f5f5f5; --mint: #bdbdbd; --orange: #777; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #050505; color: var(--ink); font-family: Manrope, sans-serif; overflow: hidden; }
    .mono { font-family: "DM Mono", monospace; }
    .map-shell { position: fixed; inset: 0; height: 100vh; min-height: 0; z-index: 0; border-radius: 0 !important; }
    #map { height: 100%; width: 100%; z-index: 0; }
    .leaflet-container { font-family: Manrope, sans-serif; background: #111; }
    .leaflet-tile { filter: none; }
    .leaflet-control-zoom { border: 0 !important; box-shadow: 0 4px 14px #000 !important; }
    .leaflet-control-zoom a { background: #fff !important; color: #111 !important; border: 0 !important; }
    /* Align the map zoom control with the right edge of the theme button. */
    .leaflet-top.leaflet-right { top: 58px; right: 24px; }
    .dropzone { transition: border-color .2s, background .2s, transform .2s; }
    .dropzone.is-over { border-color: #fff; background: #222; transform: scale(1.01); }
    .marker-pulse { width: 16px; height: 16px; border: 3px solid white; border-radius: 50%; box-shadow: 0 2px 8px #13213d55; }
    .marker-start { background: #aaa; } .marker-end { background: #666; } .marker-hover { background: #fff; width: 18px; height: 18px; }
    .bg-white { background-color: #111 !important; }
    .border-\[\#e7ecf4\], .border-\[\#dce5f2\], .border-\[\#cbd7ea\] { border-color: #292929 !important; }
    .text-\[\#13213d\], .text-\[\#2f6df6\], .text-\[\#70809c\], .text-\[\#9aa8bd\] { color: #aaa !important; }
    .bg-\[\#2f6df6\], .bg-\[\#13213d\] { background-color: #222 !important; }
    .bg-\[\#edf4ff\], .bg-\[\#fff5e9\] { background-color: #1d1d1d !important; }
    .bg-\[\#16b887\], .bg-\[\#ef5e62\] { background-color: #777 !important; }
    .shadow-\[0_10px_40px_\#193b7410\], .shadow-blue-200 { box-shadow: 0 10px 40px #000 !important; }
    .hover\:border-\[\#2f6df6\]:hover { border-color: #777 !important; }
    .theme-toggle { border: 1px solid #333; background: #151515; color: #eee; }
    body.light { background: #f7f9fc; color: #13213d; }
    body.light .bg-white { background-color: #fff !important; }
    body.light .border-\[\#e7ecf4\], body.light .border-\[\#dce5f2\], body.light .border-\[\#cbd7ea\] { border-color: #e7ecf4 !important; }
    body.light .text-\[\#13213d\] { color: #13213d !important; }
    body.light .text-\[\#2f6df6\] { color: #000 !important; }
    body.light .text-\[\#70809c\] { color: #70809c !important; }
    body.light .text-\[\#9aa8bd\] { color: #9aa8bd !important; }
    body.light .bg-\[\#2f6df6\] { background-color: #2f6df6 !important; }
    body.light .bg-\[\#13213d\] { background-color: #13213d !important; }
    body.light .bg-\[\#edf4ff\] { background-color: #edf4ff !important; }
    body.light .bg-\[\#fff5e9\] { background-color: #fff5e9 !important; }
    body.light .bg-\[\#16b887\] { background-color: #16b887 !important; }
    body.light .bg-\[\#ef5e62\] { background-color: #ef5e62 !important; }
    body.light .shadow-\[0_10px_40px_\#193b7410\] { box-shadow: 0 10px 40px #193b7410 !important; }
    body.light .theme-toggle { border-color: #dce5f2; background: #fff; color: #13213d; }
    .stat-value { letter-spacing: -.04em; }
    .route-detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .route-detail-item { border-left: 2px solid #777; padding-left: 12px; }
    .route-events { max-height: 270px; overflow-y: auto; }
    .route-event { display: grid; grid-template-columns: 42px 1fr; gap: 12px; align-items: start; border-bottom: 1px solid #292929; padding: 12px 0; }
    .route-event:last-child { border-bottom: 0; padding-bottom: 0; }
    .route-event-distance { color: #e53935; font-family: "DM Mono", monospace; font-size: 11px; font-weight: 500; padding-top: 3px; }
    .settings-backdrop { align-items: flex-start !important; justify-content: flex-end !important; background: #000a; padding: 64px 24px 24px !important; }
    main { max-width: none !important; padding: 0 !important; }
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 20; padding: 16px 24px; pointer-events: none; }
    header > div { pointer-events: auto; }
    .search-box { position: fixed; top: 16px; left: 24px; z-index: 21; width: min(380px, calc(100vw - 180px)); }
    .search-form { display: flex; overflow: hidden; border: 1px solid #333; border-radius: 10px; background: #111e; backdrop-filter: blur(12px); }
    .search-form input { min-width: 0; flex: 1; border: 0; outline: 0; background: transparent; color: #f5f5f5; padding: 11px 8px 11px 12px; font: 600 13px Manrope, sans-serif; }
    .search-form input::-webkit-search-cancel-button { display: none; }
    .search-form input::placeholder { color: #999; }
    .search-form button { border: 0; border-left: 1px solid #333; background: transparent; color: #f5f5f5; padding: 0 13px; cursor: pointer; }
    .search-clear { display: none; border: 0 !important; border-left: 0 !important; padding: 0 4px !important; color: #999 !important; font-size: 14px; }
    .search-clear.is-visible { display: block; }
    .search-results { display: none; overflow: hidden; margin-top: 6px; border: 1px solid #333; border-radius: 10px; background: #111f; backdrop-filter: blur(12px); }
    .search-results.is-visible { display: block; }
    .search-result { display: block; width: 100%; border: 0; border-bottom: 1px solid #292929; background: transparent; color: #eee; cursor: pointer; padding: 10px 12px; text-align: left; font: 500 12px/1.4 Manrope, sans-serif; }
    .search-result:last-child { border-bottom: 0; }
    .search-result:hover { background: #292929; }
    body.light .search-form, body.light .search-results { border-color: #dce5f2; background: #fffe; }
    body.light .search-form input, body.light .search-result { color: #13213d; }
    body.light .search-form button { border-color: #dce5f2; color: #13213d; }
    @media (max-width: 640px) { .search-box { top: 12px; left: 12px; width: calc(100vw - 150px); } }
    .map-frame { position: static !important; border: 0 !important; background: transparent !important; padding: 0 !important; box-shadow: none !important; }
    .map-frame > div:last-child { position: fixed; bottom: 20px; left: 24px; z-index: 10; border-radius: 12px; background: #111d !important; padding: 10px 14px !important; }
    /* The ride summary is intentionally flat: it sits directly beside the
       telemetry instead of being made up of separate, competing cards. */
    .extras-panel { position: fixed; left: 24px; right: 24px; bottom: 20px; z-index: 15; max-height: min(28vh, 250px); overflow: hidden; border: 1px solid #333; border-radius: 18px; background: #050505e8; padding: 12px 16px; backdrop-filter: blur(16px); pointer-events: none; transition: max-height .42s cubic-bezier(.22, 1, .36, 1), padding .42s cubic-bezier(.22, 1, .36, 1); }
    .extras-panel.is-expanded { max-height: min(72vh, 620px); overflow-y: auto; pointer-events: auto; }
    .extras-panel > div:first-child { margin: 0 0 8px; text-shadow: 0 1px 8px #000; }
    .route-details-toggle { display: grid; width: 28px; height: 28px; place-items: center; flex: 0 0 auto; border: 1px solid #444; border-radius: 8px; background: #1a1a1a; color: #f5f5f5; cursor: pointer; font-size: 16px; line-height: 1; pointer-events: auto; transition: transform .25s ease, background .25s ease; }
    .route-details-toggle svg { width: 17px; height: 17px; }
    .route-details-toggle:hover { background: #292929; }
    .route-details-toggle[aria-expanded="true"] { transform: rotate(180deg); }
    .route-details { max-height: 0; overflow: hidden; opacity: 0; transform: translateY(10px); transition: max-height .42s cubic-bezier(.22, 1, .36, 1), opacity .24s ease .08s, transform .42s cubic-bezier(.22, 1, .36, 1), margin .42s cubic-bezier(.22, 1, .36, 1); pointer-events: none; }
    .extras-panel.is-expanded .route-details { max-height: 330px; margin-top: 18px; opacity: 1; transform: translateY(0); pointer-events: auto; }
    .route-details-heading { display: flex; align-items: center; justify-content: space-between; margin: 0 0 6px; font-size: 12px; font-weight: 800; }
    .route-details-note { color: #999; font-size: 10px; font-weight: 600; }
    .extras-layout { display: grid !important; grid-template-columns: minmax(170px, max-content) minmax(0, 1fr); align-items: center; gap: 32px !important; width: 100%; }
    .extras-metrics { display: grid; grid-template-columns: 1fr; gap: 12px; min-width: 0; }
    .metric { min-width: 0; }
    .metric-label { margin: 0; color: #aaa; font-size: 10px; font-weight: 700; }
    .metric-value { margin: 2px 0 0; color: var(--ink); font-size: 18px; font-weight: 800; line-height: 1.1; letter-spacing: -.04em; }
    .metric-value small { margin-left: 4px; color: #aaa; font-size: 10px; font-weight: 700; letter-spacing: normal; }
    .extras-telemetry { min-width: 0; pointer-events: auto; }
    .telemetry-title { margin: 0; font-size: 13px; font-weight: 800; }
    .telemetry-help { margin: 2px 0 0; color: #aaa; font-size: 10px; }
    .telemetry-chart { height: 112px; margin-top: 6px; }
    .telemetry-legend { display: flex; gap: 20px; margin-top: 4px; color: #aaa; font-size: 10px; font-weight: 700; }
    .extras-panel canvas { max-width: 100%; }
    body.is-file-dragging .extras-panel { border-color: #e53935; background: #151515f2; }
    body.light .extras-panel { border-color: #e7ecf4; background: #fffffff2; }
    body.light.is-file-dragging .extras-panel { border-color: #e53935; background: #fff; }
    body.light .extras-panel > div:first-child { text-shadow: none; }
    body.light .metric-value { color: #13213d; }
    body.light .route-details-toggle { border-color: #dce5f2; background: #fff; color: #13213d; }
    body.light .route-details-toggle:hover { background: #edf4ff; }
    #avgSpeedInput::-webkit-outer-spin-button,
    #avgSpeedInput::-webkit-inner-spin-button { margin: 0; appearance: none; }
    #avgSpeedInput { appearance: textfield; -moz-appearance: textfield; }
    @media (max-width: 560px) { .route-detail-grid { grid-template-columns: 1fr; } }
    @media (max-width: 900px) {
      .extras-panel { left: 12px; right: 12px; bottom: 12px; padding: 10px 12px; }
      .extras-layout { grid-template-columns: minmax(120px, 170px) minmax(0, 1fr); gap: 20px !important; }
    }
    @media (max-width: 640px) {
      .extras-layout { grid-template-columns: 1fr; }
      .extras-metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .telemetry-chart { height: 92px; }
    }
    @media (max-width: 640px) { header { padding: 12px; } .leaflet-top.leaflet-right { top: 54px; right: 12px; } .extras-panel { left: 8px; right: 8px; bottom: 8px; max-height: 38vh; padding: 8px; } .map-frame > div:last-child { left: 12px; bottom: 12px; } .settings-backdrop { padding: 58px 12px 12px !important; } }
  </style>
</head>
<body>
  <main class="mx-auto max-w-[1500px] px-4 py-5 sm:px-7 lg:px-10 lg:py-8">
    <div class="search-box" id="searchBox">
      <form class="search-form" id="searchForm">
        <input id="searchInput" type="search" placeholder="장소 검색" autocomplete="off" aria-label="지도 위치 검색">
        <button class="search-clear" id="searchClear" type="button" aria-label="검색어 지우기">×</button>
        <button type="submit" aria-label="검색">⌕</button>
      </form>
      <div class="search-results" id="searchResults" role="listbox"></div>
    </div>
    <header class="mb-6 flex flex-col justify-between gap-5 sm:flex-row sm:items-end">
      <div>

      </div>
      <div class="flex items-center gap-3 text-xs font-semibold text-[#70809c]">
        <button class="theme-toggle rounded-lg px-3 py-2 text-xs font-bold" id="settingsToggle" type="button">설정</button>
      </div>
    </header>

    <section class="space-y-5">
      <div class="map-frame rounded-2xl border border-[#e7ecf4] bg-white p-2 shadow-[0_10px_40px_#193b7410]">
        <div class="map-shell overflow-hidden rounded-xl"><div id="map"></div></div>
        <div class="flex flex-wrap items-center justify-between gap-3 px-3 py-3 text-xs text-[#70809c] sm:px-4">
          <div class="flex items-center gap-4">
            <span class="flex items-center gap-2"><i class="h-2.5 w-2.5 rounded-full bg-[#16b887]"></i>출발</span>
            <span class="flex items-center gap-2"><i class="h-2.5 w-2.5 rounded-full bg-[#ef5e62]"></i>도착</span>
            <span class="flex items-center gap-2"><i class="h-2.5 w-2.5 rounded-full bg-[#2f6df6]"></i>현재 위치</span>
          </div>
        </div>
      </div>
      <div class="extras-panel" id="routeDetailsPanel">
        <div class="mb-3 flex items-center justify-between"><span class="text-xs text-[#70809c]" id="fileName" aria-live="polite">GPX 파일을 드래그해서 파일을 불러오세요</span><button class="route-details-toggle" id="routeDetailsToggle" type="button" aria-expanded="false" aria-controls="routeDetails" aria-label="경로 상세정보 확장" title="경로 상세정보 확장"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7M21 3l-8 8M10 21H3v-7M3 21l8-8"/></svg></button></div>
        <div class="extras-layout">
          <dl class="extras-metrics" aria-label="라이딩 요약">
            <div class="metric"><dt class="metric-label">총 이동 거리</dt><dd class="metric-value"><span id="distance">0.0</span><small>km</small></dd></div>
            <div class="metric"><dt class="metric-label">총 획득 고도</dt><dd class="metric-value"><span id="elevation">0</span><small>m</small></dd></div>
            <div class="metric"><dt class="metric-label">총 소요 시간</dt><dd class="metric-value mono" id="duration">00:00:00</dd></div>
          </dl>
          <section class="extras-telemetry" aria-labelledby="telemetryTitle">
            <h2 class="telemetry-title" id="telemetryTitle">라이딩 텔레메트리</h2>
            <p class="telemetry-help">차트 위에 마우스를 올려 경로를 확인하세요.</p>
            <div class="telemetry-chart"><canvas id="telemetryChart"></canvas></div>
            <div class="telemetry-legend"><span><i class="mr-1.5 inline-block h-2 w-2 rounded-full bg-[#e53935]"></i>고도 (m)</span></div>
          </section>
          </div>
        <section class="route-details" id="routeDetails" aria-labelledby="routeDetailsTitle">
          <div class="route-details-heading"><h2 id="routeDetailsTitle">경로 상세정보</h2><span class="route-details-note">경로 안내</span></div>
          <div class="route-events" id="routeEvents"><p class="text-xs text-[#70809c]">GPX 파일을 불러오면 경로 안내가 표시됩니다.</p></div>
        </section>
        </div>
      </div>
    </section>
    <div class="settings-backdrop fixed inset-0 z-[1000] hidden flex items-center justify-center p-4" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="w-full max-w-md rounded-2xl border border-[#e7ecf4] bg-white p-5 shadow-2xl">
        <div class="mb-5 flex items-center justify-between"><h2 class="font-extrabold" id="settingsTitle">설정</h2><button class="theme-toggle rounded-lg px-3 py-2 text-sm" id="settingsClose" type="button" aria-label="설정 닫기">×</button></div>
        <label class="flex items-center justify-between gap-4" for="avgSpeedInput">
          <span><span class="block font-extrabold">평균 주행 속도</span><span class="mt-1 block text-xs text-[#70809c]">예상 소요 시간 계산에 사용합니다.</span></span>
          <span class="flex shrink-0 items-center gap-2"><input id="avgSpeedInput" class="w-20 rounded-lg border border-[#dce5f2] bg-transparent px-3 py-2 text-right font-bold outline-none focus:border-[#777]" type="number" min="1" max="100" step="0.5" value="20" aria-label="평균 주행 속도"><span class="text-xs font-bold text-[#70809c]">km/h</span></span>
        </label>
        <label class="mt-5 flex items-center justify-between gap-4" for="themeSelect">
          <span><span class="block font-extrabold">화면 테마</span><span class="mt-1 block text-xs text-[#70809c]">라이트 또는 다크 모드를 선택합니다.</span></span>
          <select id="themeSelect" class="rounded-lg border border-[#dce5f2] bg-transparent px-3 py-2 text-sm font-bold outline-none focus:border-[#777]">
            <option value="dark">다크 모드</option>
            <option value="light">화이트 모드</option>
          </select>
        </label>
      </div>
    </div>
    <footer class="mt-7 flex items-center justify-end border-t border-[#e7ecf4] pt-4 text-[11px] text-[#9aa8bd]"><span>OpenStreetMap · Leaflet</span></footer>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    let points = [], routeLayer, hoverMarker, chart, searchMarker;
    const chartTheme = {
      dark: { text: '#9aa8bd', grid: '#eef2f7', tooltip: '#13213d' },
      light: { text: '#70809c', grid: '#eef2f7', tooltip: '#13213d' }
    };
    const map = L.map('map', { zoomControl: false }).setView([37.5665, 126.978], 12);
    L.control.zoom({ position: 'topright' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19,
      referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);
    const pin = (className) => L.divIcon({ className: '', html: `<div class="marker-pulse ${className}"></div>`, iconSize: [16, 16], iconAnchor: [8, 8] });
    const searchPin = L.divIcon({ className: '', html: '<div class="marker-pulse marker-hover"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });

    function haversine(a, b) {
      const r = 6371, rad = Math.PI / 180, dLat = (b.lat-a.lat)*rad, dLon = (b.lon-a.lon)*rad;
      const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLon/2)**2;
      return r * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
    }
    function durationText(seconds) {
      const h = Math.floor(seconds / 3600), m = Math.floor(seconds % 3600 / 60), s = Math.floor(seconds % 60);
      return [h,m,s].map(v => String(v).padStart(2, '0')).join(':');
    }
    function bearing(a, b) {
      const rad = Math.PI / 180, y = Math.sin((b.lon-a.lon)*rad) * Math.cos(b.lat*rad);
      const x = Math.cos(a.lat*rad)*Math.sin(b.lat*rad) - Math.sin(a.lat*rad)*Math.cos(b.lat*rad)*Math.cos((b.lon-a.lon)*rad);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }
    function turnDelta(from, to) {
      return (to - from + 540) % 360 - 180;
    }
    function routeEvents(route) {
      const events = [{ distance: 0, icon: '●', title: '라이딩 출발', detail: '트랙의 시작점에서 출발합니다.' }];
      const look = Math.max(2, Math.floor(route.length / 45));
      let lastTurn = 0;
      for (let i = look; i < route.length - look; i += 1) {
        const before = bearing(route[i-look], route[i]);
        const after = bearing(route[i], route[i+look]);
        const delta = turnDelta(before, after);
        if (Math.abs(delta) < 32 || route[i].distance - lastTurn < .12) continue;
        const direction = delta > 0 ? '우회전' : '좌회전';
        events.push({ distance: route[i].distance, icon: delta > 0 ? '↱' : '↰', title: direction, detail: `${Math.round(Math.abs(delta))}° 방향 전환 · 트랙 기준` });
        lastTurn = route[i].distance;
      }
      events.push({ distance: route.at(-1).distance, icon: '■', title: '도착', detail: '라이딩 경로의 마지막 지점입니다.' });
      return events;
    }
    function renderRouteEvents(route) {
      $('routeEvents').innerHTML = routeEvents(route).map(event => `
        <div class="route-event">
          <div class="route-event-distance">${event.distance < .1 ? 'START' : `${event.distance.toFixed(2)} km`}</div>
          <div><div class="flex items-center gap-2 font-bold"><span class="text-base text-[#e53935]">${event.icon}</span>${event.title}</div><p class="mt-1 text-xs text-[#70809c]">${event.detail}</p></div>
        </div>`).join('');
    }
    async function loadApiRouteEvents(route) {
      try {
        const response = await fetch('/api/route-events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ points: route.map(({ lat, lon }) => ({ lat, lon })) })
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || '경로 안내를 불러오지 못했습니다.');
        if (!payload.events?.length) throw new Error('경로 안내 이벤트가 없습니다.');
        $('routeEvents').innerHTML = payload.events.map((event, index) => `
          <div class="route-event">
            <div class="route-event-distance">${index === 0 ? 'START' : `${Number(event.distance).toFixed(2)} km`}</div>
            <div><div class="flex items-center gap-2 font-bold"><span class="text-base text-[#e53935]">↱</span>${event.title}</div><p class="mt-1 text-xs text-[#70809c]">${event.detail || '도로 경로 안내'}</p></div>
          </div>`).join('');
      } catch (error) {
        console.warn('도로 경로 안내를 불러오지 못했습니다.', error);
      }
    }
    function parseGPX(xml) {
      const doc = new DOMParser().parseFromString(xml, 'application/xml');
      if (doc.querySelector('parsererror')) throw new Error('GPX XML을 읽을 수 없습니다.');
      const nodes = [...doc.querySelectorAll('trkpt')];
      const parsed = nodes.map(node => {
        const lat = Number(node.getAttribute('lat')), lon = Number(node.getAttribute('lon'));
        const ele = Number(node.querySelector('ele')?.textContent || 0);
        const timeValue = node.querySelector('time')?.textContent?.trim();
        const time = timeValue ? new Date(timeValue) : null;
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
        return { lat, lon, ele: Number.isFinite(ele) ? ele : 0, time: time && Number.isFinite(time.getTime()) ? time : null };
      }).filter(Boolean);
      if (parsed.length < 2) throw new Error('유효한 트랙 포인트가 2개 이상 필요합니다.');
      let distance = 0, gain = 0, movingSeconds = 0;
      parsed.forEach((p, i) => {
        if (i) {
          const prev = parsed[i-1]; p.segmentKm = haversine(prev, p); distance += p.segmentKm;
          gain += Math.max(0, p.ele - prev.ele);
          const seconds = (p.time - prev.time) / 1000;
          if (Number.isFinite(seconds) && seconds > 0 && seconds < 3600) { p.speed = p.segmentKm / seconds * 3600; movingSeconds += seconds; } else p.speed = 0;
        } else { p.segmentKm = 0; p.speed = 0; }
        p.distance = distance;
      });
      const speeds = parsed.map(p => p.speed).filter(v => v > 0 && v < 100);
      const timedPoints = parsed.filter(point => point.time);
      const elapsed = timedPoints.length > 1 ? Math.max(0, (timedPoints.at(-1).time - timedPoints[0].time) / 1000) : null;
      return { points: parsed, distance, gain, avgSpeed: distance / (movingSeconds || elapsed || 1) * 3600, maxSpeed: speeds.length ? Math.max(...speeds) : 0, elapsed };
    }
    function render(data, name = 'ride.gpx') {
      points = data.points; $('fileName').textContent = name;
      $('distance').textContent = data.distance.toFixed(1); $('elevation').textContent = Math.round(data.gain);
      updateDuration(data.distance);
      if (routeLayer) map.removeLayer(routeLayer);
      if (hoverMarker) map.removeLayer(hoverMarker);
      const latlngs = points.map(p => [p.lat, p.lon]);
      const routeLine = L.polyline(latlngs, { color: '#e53935', weight: 5, opacity: .95, lineCap: 'round', lineJoin: 'round' });
      const startMarker = L.marker(latlngs[0], { icon: pin('marker-start') }).bindTooltip('출발점');
      const endMarker = L.marker(latlngs.at(-1), { icon: pin('marker-end') }).bindTooltip('도착점');
      routeLayer = L.layerGroup([routeLine, startMarker, endMarker]).addTo(map);
      hoverMarker = L.marker(latlngs[0], { icon: pin('marker-hover'), zIndexOffset: 1000 }).addTo(map);
      map.fitBounds(routeLine.getBounds(), { padding: [28, 28] });
      if (chart) chart.destroy();
      chart = new Chart($('telemetryChart'), {
        type: 'line',
        data: { datasets: [
          { label: '고도', data: points.map(p => ({ x: p.distance, y: p.ele })), borderColor: '#e53935', backgroundColor: '#e5393526', fill: true, pointRadius: 0, borderWidth: 2, tension: .25, yAxisID: 'y' }
        ] },
        options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
          onHover: (_, elements) => { if (elements.length) { const i = elements[0].index; hoverMarker.setLatLng([points[i].lat, points[i].lon]); } },
          scales: { x: { type: 'linear', title: { display: true, text: '거리 (km)', color: '#9aa8bd', font: { size: 10, weight: '600' } }, grid: { display: false }, ticks: { color: '#9aa8bd', font: { size: 10 } } }, y: { title: { display: true, text: '고도 (m)', color: '#9aa8bd', font: { size: 10 } }, grid: { display: false }, ticks: { color: '#9aa8bd', font: { size: 10 } } } },
          plugins: { legend: { display: false }, tooltip: { backgroundColor: '#13213d', padding: 10, displayColors: false, callbacks: { title: items => `${items[0].parsed.x.toFixed(2)} km`, label: item => `${item.dataset.label}: ${item.parsed.y.toFixed(1)} ${item.datasetIndex ? 'km/h' : 'm'}` } } }
        }
      });
      updateChartTheme();
      renderRouteEvents(points);
      loadApiRouteEvents(points);
    }
    function updateChartTheme() {
      if (!chart) return;
      const theme = document.body.classList.contains('light') ? chartTheme.light : chartTheme.dark;
      chart.options.scales.x.ticks.color = theme.text;
      chart.options.scales.x.title.color = theme.text;
      chart.options.scales.y.ticks.color = theme.text;
      chart.options.scales.y.title.color = theme.text;
      chart.options.scales.y.grid.color = theme.grid;
      chart.options.plugins.tooltip.backgroundColor = theme.tooltip;
      chart.update();
    }
    function updateDuration(distance) {
      const speed = Number($('avgSpeedInput').value);
      $('duration').textContent = speed > 0 ? durationText(distance / speed * 3600) : '--:--:--';
    }
    function applyTheme(theme) {
      document.body.classList.toggle('light', theme === 'light');
      $('themeSelect').value = theme;
      localStorage.setItem('gpx-theme', theme);
      updateChartTheme();
    }
    const isGPX = file => Boolean(file && (/\.gpx$/i.test(file.name) || /gpx|xml/i.test(file.type)));
    const containsFiles = event => [...(event.dataTransfer?.types || [])].includes('Files');
    const setFileMessage = message => { $('fileName').textContent = message; };
    function showSearchResults(results) {
      const container = $('searchResults');
      container.replaceChildren();
      if (!results.length) {
        const empty = document.createElement('div');
        empty.className = 'search-result';
        empty.textContent = '검색 결과가 없습니다.';
        container.append(empty);
      }
      container.classList.add('is-visible');
      results.forEach(result => {
        const button = document.createElement('button');
        button.className = 'search-result';
        button.type = 'button';
        button.textContent = result.name;
        button.addEventListener('click', () => {
          const lat = Number(result.lat), lon = Number(result.lon);
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
          if (searchMarker) map.removeLayer(searchMarker);
          searchMarker = L.marker([lat, lon], { icon: searchPin }).addTo(map);
          searchMarker.bindTooltip(result.name, { direction: 'top', offset: [0, -8] }).openTooltip();
          map.setView([lat, lon], 16);
          container.classList.remove('is-visible');
        });
        container.append(button);
      });
    }
    async function searchLocation(query) {
      const response = await fetch(`/api/geocode?q=${encodeURIComponent(query)}`);
      const body = await response.text();
      let payload;
      try {
        payload = JSON.parse(body);
      } catch {
        throw new Error(`검색 서버가 JSON이 아닌 응답을 반환했습니다 (HTTP ${response.status}). 서버를 다시 시작해 주세요.`);
      }
      if (!response.ok) throw new Error(payload.error || '위치 검색에 실패했습니다.');
      showSearchResults(payload.results || []);
    }
    function handleFile(file) {
      if (!isGPX(file)) { setFileMessage('GPX 파일만 불러올 수 있습니다.'); return; }
      setFileMessage(`${file.name} 불러오는 중…`);
      const reader = new FileReader();
      reader.onerror = () => setFileMessage(`${file.name}을 읽지 못했습니다.`);
      reader.onload = event => {
        try {
          render(parseGPX(event.target.result), file.name);
          setFileMessage(file.name);
        } catch (error) {
          console.error(error);
          setFileMessage(`${file.name}은(는) 유효한 GPX 파일이 아닙니다.`);
        }
      };
      reader.readAsText(file);
    }
    $('avgSpeedInput').addEventListener('input', () => {
      if (points.length) updateDuration(points.at(-1).distance);
    });
    $('searchForm').addEventListener('submit', async event => {
      event.preventDefault();
      const query = $('searchInput').value.trim();
      if (query.length < 2) return;
      $('searchResults').innerHTML = '<div class="search-result">검색 중...</div>';
      $('searchResults').classList.add('is-visible');
      try {
        await searchLocation(query);
      } catch (error) {
        $('searchResults').textContent = error.message;
      }
    });
    $('searchInput').addEventListener('input', event => {
      $('searchClear').classList.toggle('is-visible', event.target.value.length > 0);
    });
    $('searchClear').addEventListener('click', () => {
      $('searchInput').value = '';
      $('searchClear').classList.remove('is-visible');
      $('searchResults').classList.remove('is-visible');
      $('searchInput').focus();
    });
    document.addEventListener('click', event => {
      if (!$('searchBox').contains(event.target)) $('searchResults').classList.remove('is-visible');
    });
    $('settingsToggle').addEventListener('click', () => $('settingsModal').classList.remove('hidden'));
    $('settingsClose').addEventListener('click', () => $('settingsModal').classList.add('hidden'));
    $('settingsModal').addEventListener('click', event => {
      if (event.target === $('settingsModal')) $('settingsModal').classList.add('hidden');
    });
    const routeDetailsPanel = $('routeDetailsPanel');
    const routeDetailsToggle = $('routeDetailsToggle');
    function setRouteDetailsExpanded(expanded) {
      routeDetailsPanel.classList.toggle('is-expanded', expanded);
      routeDetailsToggle.setAttribute('aria-expanded', String(expanded));
      routeDetailsToggle.setAttribute('aria-label', expanded ? '경로 상세정보 접기' : '경로 상세정보 확장');
      routeDetailsToggle.title = expanded ? '경로 상세정보 접기' : '경로 상세정보 확장';
    }
    routeDetailsToggle.addEventListener('click', () => setRouteDetailsExpanded(!routeDetailsPanel.classList.contains('is-expanded')));
    routeDetailsPanel.addEventListener('transitionend', event => {
      if (event.propertyName === 'max-height' && chart) chart.resize();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') $('settingsModal').classList.add('hidden');
    });
    $('themeSelect').addEventListener('change', event => applyTheme(event.target.value));
    let fileDragDepth = 0;
    document.addEventListener('dragenter', event => {
      if (!containsFiles(event)) return;
      event.preventDefault();
      fileDragDepth += 1;
      document.body.classList.add('is-file-dragging');
    }, true);
    document.addEventListener('dragover', event => {
      if (!containsFiles(event)) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = 'copy';
    }, true);
    document.addEventListener('dragleave', event => {
      if (!containsFiles(event)) return;
      fileDragDepth = Math.max(0, fileDragDepth - 1);
      if (!fileDragDepth) document.body.classList.remove('is-file-dragging');
    }, true);
    document.addEventListener('drop', event => {
      if (!containsFiles(event)) return;
      event.preventDefault();
      fileDragDepth = 0;
      document.body.classList.remove('is-file-dragging');
      handleFile([...event.dataTransfer.files].find(isGPX));
    }, true);
    applyTheme(localStorage.getItem('gpx-theme') === 'light' ? 'light' : 'dark');
  </script>
</body>
</html>
